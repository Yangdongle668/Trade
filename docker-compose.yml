services:
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/out:/srv/spa:ro
      - caddy_data:/data
    depends_on: [api]

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on: [postgres, redis]

  worker:
    build: ./backend
    command: celery -A app.celery_app worker -Q discovery,sequence,mailbox,maintenance -l info --concurrency=4
    env_file: .env
    depends_on: [postgres, redis]

  beat:
    build: ./backend
    command: celery -A app.celery_app beat -l info
    env_file: .env
    depends_on: [redis]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: outreach
      POSTGRES_PASSWORD: outreach
      POSTGRES_DB: outreach
    volumes: ["pg_data:/var/lib/postgresql/data"]
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    volumes: ["redis_data:/data"]
    ports: ["6379:6379"]

volumes:
  caddy_data:
  pg_data:
  redis_data:
