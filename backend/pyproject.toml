[project]
name = "outreach-backend"
version = "0.1.0"
description = "外贸 AI 客户开发助手 — 后端（FastAPI 模块化单体）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "structlog>=24.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "tldextract>=5.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "cryptography>=42.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.4", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
